<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>결제 실패 | OTSTORE</title>
  <meta name="robots" content="noindex, follow">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/products.js" defer></script>
  <script src="js/art.js" defer></script>
  <script src="js/common.js" defer></script>
  <script src="js/fail.js" defer></script>
</head>
<body>
  <header class="header">
    <div class="container topbar__inner">
      <a class="logo" href="index.html">OTSTORE</a>
      <ol class="header__steps" aria-label="주문 단계">
        <li>장바구니</li>
        <li class="is-current" aria-current="step">주문/결제</li>
        <li>주문완료</li>
      </ol>
    </div>
  </header>

  <main class="container">
    <section class="result">
      <div class="result__icon result__icon--fail" data-result-icon></div>
      <h1 class="result__title" data-result-title>결제에 실패했어요</h1>
      <p class="result__desc" data-result-desc></p>
      <dl class="receipt" data-receipt></dl>
      <div class="result__actions">
        <a class="btn btn--line" href="index.html#cart">장바구니로</a>
        <a class="btn btn--dark" href="checkout.html" data-retry>다시 결제하기</a>
      </div>
    </section>
  </main>
</body>
</html>
