<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>주문 완료 | OTSTORE</title>
  <meta name="robots" content="noindex, follow">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/products.js" defer></script>
  <script src="js/art.js" defer></script>
  <script src="js/common.js" defer></script>
  <script src="js/success.js" defer></script>
</head>
<body>
  <header class="header">
    <div class="container topbar__inner">
      <a class="logo" href="index.html">OTSTORE</a>
      <ol class="header__steps" aria-label="주문 단계">
        <li>장바구니</li>
        <li>주문/결제</li>
        <li class="is-current" aria-current="step">주문완료</li>
      </ol>
    </div>
  </header>

  <main class="container">
    <section class="result" aria-live="polite">
      <div class="result__icon result__icon--loading" data-result-icon></div>
      <h1 class="result__title" data-result-title>결제 정보를 확인하고 있어요</h1>
      <p class="result__desc" data-result-desc>잠시만 기다려 주세요.</p>

      <dl class="receipt" data-receipt hidden></dl>
      <ul class="order-items" data-result-items></ul>

      <div class="dev-note" data-dev-note hidden>
        <strong>퍼블리싱 모드 안내</strong><br>
        결제 인증까지 완료된 상태예요. 최종 결제 승인은 서버에서 시크릿 키로 결제 승인 API를 호출해야 확정됩니다.
        <code>js/success.js</code>의 <code>CONFIRM_ENDPOINT</code>에 서버 주소를 넣으면 이 화면에서 승인을 요청해요.
      </div>

      <div class="result__actions" data-result-actions hidden>
        <a class="btn btn--dark" href="index.html">쇼핑 계속하기</a>
      </div>
    </section>
  </main>
</body>
</html>
