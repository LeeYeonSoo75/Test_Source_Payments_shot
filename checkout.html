<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>주문서 | OTSTORE</title>
  <meta name="robots" content="noindex, follow">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="css/style.css">
  <!-- 토스페이먼츠 JavaScript SDK v2 -->
  <script src="https://js.tosspayments.com/v2/standard"></script>
  <script src="js/products.js" defer></script>
  <script src="js/art.js" defer></script>
  <script src="js/common.js" defer></script>
  <script src="js/checkout.js" defer></script>
</head>
<body>
  <header class="header">
    <div class="container topbar__inner">
      <a class="logo" href="index.html">OTSTORE</a>
      <ol class="header__steps" aria-label="주문 단계">
        <li>장바구니</li>
        <li class="is-current" aria-current="step">주문/결제</li>
        <li>주문완료</li>
      </ol>
    </div>
  </header>

  <main class="container">
    <h1 class="page-title">주문서</h1>

    <div class="checkout-empty" data-checkout-empty hidden>
      <p>주문할 상품이 없어요.</p>
      <a class="btn btn--dark" href="index.html">쇼핑하러 가기</a>
    </div>

    <form class="checkout__grid" data-checkout novalidate>
      <div class="checkout__main">
        <section class="panel" aria-labelledby="shipTitle">
          <h2 class="panel__title" id="shipTitle">배송 정보</h2>

          <div class="field">
            <label class="field__label" for="name">받는 분<em aria-hidden="true">*</em></label>
            <div>
              <input class="input" id="name" name="name" autocomplete="name" maxlength="20" required aria-describedby="nameError">
              <p class="field__error" id="nameError" hidden></p>
            </div>
          </div>

          <div class="field">
            <label class="field__label" for="phone">휴대폰 번호<em aria-hidden="true">*</em></label>
            <div>
              <input class="input" id="phone" name="phone" type="tel" inputmode="numeric" autocomplete="tel" maxlength="13" placeholder="010-0000-0000" required aria-describedby="phoneError">
              <p class="field__error" id="phoneError" hidden></p>
            </div>
          </div>

          <div class="field">
            <label class="field__label" for="email">이메일<small>(선택)</small></label>
            <div>
              <input class="input" id="email" name="email" type="email" autocomplete="email" placeholder="결제 내역을 받을 이메일" aria-describedby="emailError">
              <p class="field__error" id="emailError" hidden></p>
            </div>
          </div>

          <div class="field">
            <label class="field__label" for="address">주소<em aria-hidden="true">*</em></label>
            <div>
              <div class="field__stack">
                <input class="input" id="address" name="address" autocomplete="street-address" placeholder="도로명 주소" required aria-describedby="addressError">
                <input class="input" id="addressDetail" name="addressDetail" autocomplete="address-line2" placeholder="상세 주소" aria-label="상세 주소">
              </div>
              <p class="field__error" id="addressError" hidden></p>
            </div>
          </div>

          <div class="field">
            <label class="field__label" for="memo">배송 요청사항</label>
            <select class="input" id="memo" name="memo">
              <option value="">선택 안 함</option>
              <option>문 앞에 놓아주세요</option>
              <option>경비실에 맡겨주세요</option>
              <option>배송 전 연락 부탁드려요</option>
              <option>택배함에 넣어주세요</option>
            </select>
          </div>
        </section>

        <section class="panel" aria-labelledby="itemsTitle">
          <h2 class="panel__title" id="itemsTitle">주문 상품 <small data-item-count></small></h2>
          <ul class="order-items" data-items></ul>
        </section>

        <section class="panel" aria-labelledby="payTitle">
          <h2 class="panel__title" id="payTitle">결제 수단</h2>
          <p class="widget__loading" data-widget-loading>결제 수단을 불러오는 중이에요…</p>
          <!-- 토스페이먼츠 결제위젯이 렌더링되는 영역 -->
          <div id="payment-method" class="widget"></div>
          <div id="agreement" class="widget widget--agreement"></div>
          <p class="widget__error" data-widget-error role="alert" hidden></p>
        </section>
      </div>

      <aside class="checkout__side" aria-labelledby="sumTitle">
        <div class="summary">
          <h2 class="summary__title" id="sumTitle">결제 금액</h2>
          <dl class="sum">
            <div class="sum__row"><dt>상품 금액</dt><dd data-sum-original>0원</dd></div>
            <div class="sum__row"><dt>할인 금액</dt><dd class="is-sale" data-sum-discount>0원</dd></div>
            <div class="sum__row"><dt>배송비</dt><dd data-sum-shipping>무료</dd></div>
          </dl>
          <div class="summary__total"><span>총 결제 금액</span><strong data-sum-total>0원</strong></div>
          <p class="summary__point" data-sum-point></p>
          <button type="submit" class="btn btn--dark btn--block btn--pay" data-pay disabled>결제하기</button>
          <p class="summary__note">주문 내용을 확인했으며 결제에 동의합니다.<br>테스트 결제로 실제 금액은 청구되지 않습니다.</p>
        </div>
      </aside>
    </form>
  </main>
</body>
</html>
